onboarding = false

[theme]
name = "catppuccin"
auto_switch = true

[theme.custom.light]
panel_bg = "#ffffff"
accent = "#000000"
surface0 = "#d4d4d4"
overlay0 = "#000000"
overlay1 = "#000000"
yellow = "#e36600"

[theme.custom.dark]
panel_bg = "#111111"
accent = "#ffffff"
surface0 = "#3c3c3c"
overlay0 = "#ffffff"
overlay1 = "#ffffff"
yellow = "#ff8e00"

[keys]
prefix = "backtick"
close_pane = ""
close_tab = ""

[[keys.command]]
key = "prefix+x"
type = "popup"
description = "Close pane"
width = 32
height = 5
command = 'printf "Close pane? [y/N] "; stty -icanon -echo; case $(dd bs=1 count=1 2>/dev/null) in [yY]) "$HERDR_BIN_PATH" pane close "$HERDR_ACTIVE_PANE_ID";; esac'

[[keys.command]]
key = "prefix+shift+x"
type = "popup"
description = "Close tab"
width = 32
height = 5
command = 'printf "Close tab? [y/N] "; stty -icanon -echo; case $(dd bs=1 count=1 2>/dev/null) in [yY]) "$HERDR_BIN_PATH" tab close "$HERDR_ACTIVE_TAB_ID";; esac'

[ui]
agent_panel_sort = "priority"
prompt_new_tab_name = false

[ui.sound]
enabled = false
