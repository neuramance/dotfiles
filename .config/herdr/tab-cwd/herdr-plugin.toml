id = "neuramance.tab-cwd"
name = "Tab cwd"
version = "1.1.0"
min_herdr_version = "0.9.3"
description = "Name each tab by its position and its focused pane's working directory"
platforms = ["linux", "macos"]

[[events]]
on = "pane.created"
command = ["bash", "./label-tabs.sh"]

[[events]]
on = "pane.focused"
command = ["bash", "./label-tabs.sh"]

[[events]]
on = "pane.moved"
command = ["bash", "./label-tabs.sh"]

[[events]]
on = "pane.closed"
command = ["bash", "./label-tabs.sh"]

[[events]]
on = "pane.exited"
command = ["bash", "./label-tabs.sh"]

[[events]]
on = "tab.moved"
command = ["bash", "./label-tabs.sh"]

[[events]]
on = "tab.closed"
command = ["bash", "./label-tabs.sh"]
